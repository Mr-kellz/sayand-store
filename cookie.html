    <!-- 🟢 ADDED GLOBAL STYLESHEET LINK -->
    <link rel="stylesheet" href="css/style.css?v=site-4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <meta name="description" content="Read about cookies and storage choices on the SAYAND website.">
    <link rel="canonical" href="https://thesayand.com/cookie">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cookie Policy | SAYAND">
    <meta property="og:description" content="Read about cookies and storage choices on the SAYAND website.">
    <meta property="og:url" content="https://thesayand.com/cookie">
    <meta property="og:image" content="https://firebasestorage.googleapis.com/v0/b/sayand-store.firebasestorage.app/o/SAYAND%20Intertwined%20S%26A%20Monogram.png?alt=media&token=4a0c7abb-0150-4d22-94fc-d58f901a45f6">

</head>
<body class="bg-[#f9f6f0] text-[#1a2e15] antialiased min-h-screen flex flex-col">

    <nav class="border-b border-[#d4af37]/30 px-6 py-4 flex justify-between items-center sticky top-0 bg-[#1a2e15] shadow-md z-50">
        <a href="index.html" class="notranslate text-2xl font-black tracking-tighter text-[#d4af37]">SAYAND</a>
        <a href="index.html" class="text-[10px] tracking-[0.2em] font-bold text-white hover:text-[#d4af37] transition-colors">← BACK TO STORE</a>
    </nav>

    <main class="max-w-3xl mx-auto px-8 py-16 md:py-24 bg-white shadow-xl mt-12 mb-12 border-t-4 border-[#2c4c23] flex-1 w-full">
        <h1 class="text-3xl md:text-4xl font-black tracking-tighter mb-8 text-[#2c4c23] uppercase">COOKIE POLICY</h1>
        <div id="legal-content" class="text-sm md:text-base text-[#1a2e15] leading-relaxed space-y-6 font-medium">
            <p class="text-[#6a7c64] font-bold text-xs tracking-widest uppercase animate-pulse">Loading content...</p>
        </div>
    </main>

    <footer class="border-t border-[#c2c9c0] py-8 px-6 text-center mt-auto bg-white">
        <p class="text-[10px] tracking-[0.2em] text-[#6a7c64] font-bold">© 2026 SAYAND. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        if (typeof firebase !== 'undefined' && firebase.database) {
            firebase.database().ref("mainStore/footer/cookie").once("value").then(snap => {
                if (snap.exists()) {
                    const data = snap.val();
                SayandI18n.registerCatalog(data);

                    if (data.title) SayandI18n.bind(document.querySelector('h1'), data.title, SayandI18n.fieldTranslations(data, 'title'));
                    if (data.content && data.content.trim().length > 10) {
                        SayandI18n.bind(document.getElementById('legal-content'), data.content, SayandI18n.fieldTranslations(data, 'content'), true);
                    } else {
                        document.getElementById('legal-content').innerHTML = "<p>No content available.</p>";
                    }
                }
            });
        }
    </script>
    
</body>
</html>
