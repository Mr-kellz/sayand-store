<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYAND | Account Action</title>
    <!-- 🟢 ADDED GLOBAL STYLESHEET LINK -->
    <link rel="stylesheet" href="css/style.css?v=site-4">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f5f5f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .box { 
            background: #fff; 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .logo { 
            font-weight: 800; 
            letter-spacing: -2px; 
            font-size: 32px; 
            margin-bottom: 8px;
        }
        .tagline { 
            font-size: 11px; 
            letter-spacing: 0.2em; 
            color: #999; 
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #000;
        }
        p { 
            color: #666; 
            font-size: 14px; 
            line-height: 1.6; 
            margin: 15px 0; 
        }
        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid #ddd; 
            font-family: 'Inter', sans-serif; 
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus { 
            outline: none; 
            border-color: #000; 
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: #000; 
            color: #fff; 
            border: none; 
            font-weight: 600; 
            letter-spacing: 0.15em; 
            cursor: pointer; 
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover { 
            background: #333; 
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error { 
            color: #dc2626; 
            font-size: 13px; 
            margin-top: 15px; 
            padding: 10px;
            background: #fef2f2;
        }
        .success { 
            color: #16a34a; 
            font-size: 13px; 
            margin-top: 15px; 
            padding: 10px;
            background: #f0fdf4;
        }
        .hidden { 
            display: none; 
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
        }
    </style>
    <link rel="stylesheet" href="css/i18n.css?v=site-4">
    <script src="js/translations.js?v=site-4"></script>
    <script src="js/i18n.js?v=site-4"></script>
    <link rel="stylesheet" href="css/site-updates.css?v=site-4">
    <script src="js/consent.js?v=site-4"></script>

    <meta name="description" content="Access your SAYAND account and shopping services securely.">
    <link rel="canonical" href="https://thesayand.com/auth-action">
    <meta name="robots" content="noindex, follow">
    <script src="js/site-updates.js?v=site-4"></script>

    <style>
        /* Keep account forms and injected preference controls in one column. */
        body { flex-direction: column; gap: 16px; }
        body > .auth-container, body > .box {
            flex: 0 0 auto;
            min-width: 0;
            overflow-wrap: anywhere;
        }
        body > .sayand-language-control {
            box-sizing: border-box;
            width: 100%;
            max-width: 400px;
        }
        body > .sayand-cookie-settings {
            box-sizing: border-box;
            width: auto;
            max-width: 100%;
            margin: 0;
        }
        .modal-overlay {
            inset: 0;
            width: auto;
            height: 100%;
            height: 100dvh;
            padding: 16px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-box {
            box-sizing: border-box;
            flex: 0 1 400px;
            min-width: 0;
            max-height: 100%;
            overflow-y: auto;
            overflow-wrap: anywhere;
        }
        @media (max-width: 480px) {
            body { padding: 20px 16px; }
            .auth-container, .box { padding: 28px 20px; }
            .modal-box { padding: 32px 20px; }
            .otp-container { gap: 6px; }
            .otp-input { flex: 1 1 0; min-width: 0; max-width: 45px; }
            .auth-container input, .box input { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- 🟢 ADDED NOTRANSLATE LOGO -->
        <div class="logo notranslate">SAYAND</div>
        <div class="tagline">Modern Essentials</div>
        
        <div id="loading-state">
            <div class="loading"></div>
            <p>Loading...</p>
        </div>
        
        <div id="reset-section" class="hidden">
            <h2>Reset Your Password</h2>
            <p>Enter your new password below.</p>
            <input type="password" id="new-password" placeholder="New password (min 6 characters)">
            <input type="password" id="confirm-password" placeholder="Confirm new password">
            <button onclick="handleReset()" id="reset-btn">RESET PASSWORD</button>
            <div id="reset-msg"></div>
        </div>
        
        <div id="verify-section" class="hidden">
            <h2>Verify Your Email</h2>
            <p>Verifying your email address...</p>
            <div class="loading"></div>
        </div>
        
        <div id="success-section" class="hidden">
            <h2 id="success-title">Success!</h2>
            <p id="success-text">Your password has been reset successfully.</p>
            <button onclick="window.location.href='login.html'" style="margin-top: 20px;">GO TO SIGN IN</button>
        </div>
        
        <div id="error-section" class="hidden">
            <h2>Something Went Wrong</h2>
            <p id="error-text">Invalid or expired link.</p>
            <button onclick="window.location.href='login.html'" style="margin-top: 20px;">BACK TO LOGIN</button>
        </div>
        
        <div class="footer">
            &copy; 2026 SAYAND. All rights reserved.
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
    // Parse URL parameters
    const url = new URL(window.location.href);
    const mode = url.searchParams.get('mode');
    const oobCode = url.searchParams.get('oobCode');

    const loadingState = document.getElementById('loading-state');
    const resetSection = document.getElementById('reset-section');
    const verifySection = document.getElementById('verify-section');
    const successSection = document.getElementById('success-section');
    const errorSection = document.getElementById('error-section');

    if (!oobCode || !mode) {
        loadingState.classList.add('hidden');
        errorSection.classList.remove('hidden');
        document.getElementById('error-text').textContent = 'Invalid or missing verification code.';
    } else if (mode === 'resetPassword') {
        loadingState.classList.add('hidden');
        resetSection.classList.remove('hidden');
        document.getElementById('new-password').focus();
    } else if (mode === 'verifyEmail') {
        loadingState.classList.add('hidden');
        verifySection.classList.remove('hidden');
        
        firebase.auth().applyActionCode(oobCode)
            .then(() => {
                verifySection.classList.add('hidden');
                successSection.classList.remove('hidden');
                document.getElementById('success-title').textContent = 'Email Verified!';
                document.getElementById('success-text').textContent = 'Your email has been verified successfully. You can now sign in.';
            })
            .catch((error) => {
                verifySection.classList.add('hidden');
                errorSection.classList.remove('hidden');
                document.getElementById('error-text').textContent = 'Invalid or expired verification link. Please request a new one.';
            });
    } else {
        loadingState.classList.add('hidden');
        errorSection.classList.remove('hidden');
        document.getElementById('error-text').textContent = 'Unknown action type.';
    }

    function handleReset() {
        const pw = document.getElementById('new-password').value;
        const confirmPw = document.getElementById('confirm-password').value;
        const msg = document.getElementById('reset-msg');
        const btn = document.getElementById('reset-btn');
        
        if (pw.length < 6) {
            msg.className = 'error';
            msg.textContent = 'Password must be at least 6 characters.';
            return;
        }
        
        if (pw !== confirmPw) {
            msg.className = 'error';
            msg.textContent = 'Passwords do not match. Please try again.';
            return;
        }
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Processing...';
        
        firebase.auth().confirmPasswordReset(oobCode, pw)
            .then(() => {
                resetSection.classList.add('hidden');
                successSection.classList.remove('hidden');
            })
            .catch((error) => {
                btn.disabled = false;
                btn.textContent = 'RESET PASSWORD';
                msg.className = 'error';
                msg.textContent = error.message;
            });
    }
    
    document.getElementById('new-password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('confirm-password').focus();
        }
    });

    document.getElementById('confirm-password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleReset();
        }
    });
    </script>
    
</body>
</html>
