<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=preorder-sections-1">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f6f0; color: #1a2e15; }
        .input-field { width: 100%; border: 1px solid #c2c9c0; padding: 0.75rem 1rem; font-size: 0.75rem; outline: none; transition: all 0.2s; background: #fff; color: #1a2e15; }

    </style>

    <link rel="stylesheet" href="css/i18n.css?v=site-4">
    <script src="js/translations.js?secureCheckout=1&orderSecurity=1&v=site-4"></script>
    <script src="js/i18n.js?v=site-4"></script>
    <link rel="stylesheet" href="css/site-updates.css?v=site-4">
    <script src="js/consent.js?v=site-4"></script>

    <meta name="description" content="Access your SAYAND account and shopping services securely.">
    <link rel="canonical" href="https://thesayand.com/track-order">
    <meta name="robots" content="noindex, follow">
    <meta property="og:image" content="https://firebasestorage.googleapis.com/v0/b/sayand-store.firebasestorage.app/o/SAYAND%20Intertwined%20S%26A%20Monogram.png?alt=media&token=4a0c7abb-0150-4d22-94fc-d58f901a45f6">

</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="bg-[#1a2e15] border-b border-[#d4af37]/30 px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <a href="index.html" class="notranslate text-2xl font-black tracking-tighter text-[#d4af37]">SAYAND</a>
        <a href="index.html" class="text-[10px] tracking-[0.2em] font-bold text-white hover:text-[#d4af37] transition-colors">&larr; BACK TO STORE</a>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-lg">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-black tracking-tighter uppercase mb-3 text-[#1a2e15]">Track Order</h1>
                <p class="text-xs text-[#6a7c64] font-medium tracking-widest uppercase">Enter your details to check status</p>
            </div>

            <div class="panel-box p-8 mb-6">
                <form id="track-form" onsubmit="trackOrder(event)" class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-black tracking-widest text-[#d4af37] mb-2 uppercase">ORDER ID (e.g. ABC123)</label>
                        <input type="text" id="track-order-id" placeholder="Enter Order ID or full code" required class="input-field text-xs font-bold uppercase">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black tracking-widest text-[#d4af37] mb-2 uppercase">EMAIL ADDRESS</label>
                        <input type="email" id="track-email" placeholder="your@email.com" required class="input-field text-xs font-bold">
                    </div>
                    <button type="submit" id="track-btn" class="w-full bg-[#1a2e15] text-[#d4af37] border border-[#d4af37] py-4 text-[10px] tracking-widest font-black hover:bg-[#2c4c23] transition-colors shadow-lg uppercase">TRACK ORDER</button>
                </form>
            </div>

            <div id="track-result" class="hidden">
                <!-- Result injected here -->
            </div>

            <div id="track-error" class="hidden panel-box p-6 border-red-200 bg-red-50 text-center">
                <p id="track-error-text" class="text-[10px] font-black text-red-600 tracking-widest uppercase">Order not found or email mismatch.</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-[#c2c9c0] py-8 px-6 text-center bg-white mt-auto">
        <p class="text-[10px] tracking-[0.2em] text-[#6a7c64] font-bold uppercase">&copy; 2026 SAYAND. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
<script src="/js/service-config.js"></script>
<script src="/js/store-services.js"></script>
<script src="/js/public-store.js?v=paid-preorders-1"></script>

    <script>
    window.trackOrder = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('track-btn');
        const result = document.getElementById('track-result');
        const errorDiv = document.getElementById('track-error');
        const errorText = document.getElementById('track-error-text');
        
        const rawInputId = document.getElementById('track-order-id').value.trim();
        const email = document.getElementById('track-email').value.trim().toLowerCase();

        const cleanInputId = rawInputId.replace(/[^a-zA-Z0-9-]/g, '');

        if (!cleanInputId) {
            errorText.innerText = 'Please enter a valid Order ID.';
            errorDiv.classList.remove('hidden');
            return;
        }

        btn.innerText = 'SEARCHING...';
        btn.disabled = true;
        result.classList.add('hidden');
        errorDiv.classList.add('hidden');

        if (typeof firebase === 'undefined' || !firebase.database) {
            alert('Firebase not loaded. Please check your connection.');
            btn.innerText = 'TRACK ORDER';
            btn.disabled = false;
            return;
        }

        try {
            let order = null;
            let matchedId = null;

            // Wait for Firebase to restore the signed-in session before querying.
            const user = await new Promise((resolve) => {
                const unsubscribe = firebase.auth().onAuthStateChanged((current) => {
                    unsubscribe();
                    resolve(current);
                });
            });
            if (!user) {
                errorText.textContent = 'Please sign in to the account used for this order, then return to this page.';
                const link = document.createElement('a');
                link.href = 'login.html';
                link.className = 'underline font-bold block mt-3';
                link.textContent = 'SIGN IN';
                errorText.appendChild(link);
                errorDiv.classList.remove('hidden');
                btn.innerText = 'TRACK ORDER';
                btn.disabled = false;
                return;
            }
            const ownOrders = await firebase.database().ref('orders')
                .orderByChild('userId').equalTo(user.uid).once('value');
            const matches = Object.entries(ownOrders.val() || {}).filter(([id, data]) =>
                (id === cleanInputId || id.slice(-6).toUpperCase() === cleanInputId.toUpperCase()) &&
                String(data.shippingInfo && data.shippingInfo.email || '').toLowerCase() === email
            );
            if (matches.length === 1) [matchedId, order] = matches[0];

            btn.innerText = 'TRACK ORDER';
            btn.disabled = false;

            if (!order) {
                errorText.innerText = 'No matching order was found in your account. Check the Order ID and order email address.';
                errorDiv.classList.remove('hidden');
                return;
            }

            const orderEmail = (order.shippingInfo && order.shippingInfo.email || '').toLowerCase();
            if (orderEmail !== email) {
                errorText.innerText = 'Email address does not match this order.';
                errorDiv.classList.remove('hidden');
                return;
            }

            const date = order.date ? new Date(order.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A';
            const status = order.status || 'Pending';
            const total = parseFloat(order.totalAmount || 0).toFixed(2);
            const items = order.items || {};

            const statusColors = {
                'Pending': 'text-orange-500',
                'Verifying': 'text-yellow-600',
                'Processing': 'text-blue-500',
                'Shipped': 'text-blue-700',
                'Delivered': 'text-[#2c4c23]',
                'Return Requested': 'text-purple-600',
                'Refunded': 'text-purple-500',
                'Canceled': 'text-red-600'
            };

            const displayStatus = {
                'Pending': 'PENDING',
                'Verifying': 'VERIFYING PAYMENT',
                'Processing': 'PREPARING SHIPMENT',
                'Paid': 'PREPARING SHIPMENT',
                'Payment Review': 'PAYMENT RECEIVED — UNDER REVIEW',
                'Return Approved': 'RETURN APPROVED',
                'Shipped': 'SHIPPED',
                'Delivered': 'DELIVERED',
                'Return Requested': 'RETURN PENDING APPROVAL',
                'Refunded': 'REFUNDED',
                'Canceled': 'CANCELED'
            }[status] || status.toUpperCase();

            let itemsHTML = '';
            Object.values(items).forEach(item => {
                itemsHTML += `
                    <div class="flex items-center gap-4 py-4 border-b border-[#c2c9c0]/30 last:border-0">
                        <img src="${item.image}" class="w-14 h-18 object-cover border border-[#c2c9c0]">
                        <div class="flex-1">
                            <p class="text-[10px] font-black tracking-wider uppercase text-[#1a2e15]">${SayandI18n.productHTML(item)}</p>
                            <p class="text-[10px] text-[#6a7c64] font-bold uppercase mt-1">QTY: ${item.quantity} | SIZE: ${item.size}</p>
                        </div>
                        <p class="text-[10px] font-black text-[#1a2e15]">€${(item.price * item.quantity).toFixed(2)}</p>
                    </div>
                `;
            });

            let trackingHTML = '';
            if (order.tracking) {
                trackingHTML = `
                    <div class="mt-6 pt-4 border-t border-[#d4af37]/30">
                        <p class="text-[9px] font-black text-[#d4af37] tracking-widest uppercase mb-1">TRACKING NUMBER</p>
                        <p class="text-xs font-mono text-[#1a2e15] font-black">${order.tracking}</p>
                    </div>
                `;
            }

            result.innerHTML = `
                <div class="panel-box p-6 md:p-8 animate-fade-in">
                    <div class="flex justify-between items-start mb-4 border-b border-[#d4af37]/30 pb-4">
                        <div>
                            <h3 class="text-xs font-black tracking-wider mb-1 text-[#1a2e15]">ORDER #${matchedId.slice(-6).toUpperCase()}</h3>
                            <p class="text-[10px] text-[#6a7c64] uppercase tracking-widest font-bold">${date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-black tracking-wider ${statusColors[status] || 'text-[#1a2e15]'} uppercase">${displayStatus}</p>
                            <p class="text-xs font-black mt-1 text-[#1a2e15]">€${total} EUR</p>
                        </div>
                    </div>
                    <div class="space-y-0">
                        ${itemsHTML}
                    </div>
                    ${trackingHTML}
                </div>
            `;
            result.classList.remove('hidden');

        } catch (err) {
            console.error(err);
            btn.innerText = 'TRACK ORDER';
            btn.disabled = false;
            
            errorText.innerText = 'Error loading order. Please try again.';
            errorDiv.classList.remove('hidden');
        }
    };
    </script>
    
<script src="/js/elia.js?v=20261024-reliability"></script>
</body>
</html>
