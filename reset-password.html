<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYAND | Reset Password</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f9f6f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        .auth-container { background: #fff; padding: 40px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03); box-sizing: border-box; position: relative; border-top: 3px solid #2c4c23; border: 1px solid #c2c9c0; }
        h1 { font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; color: #1a2e15;}
        h2 { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #6a7c64; margin-bottom: 30px; text-transform: uppercase; }
        
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #c2c9c0; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 13px; color: #1a2e15;}
        input:focus { border-color: #d4af37; outline: none; box-shadow: 0 0 0 1px #d4af37;}
        
        button { width: 100%; padding: 15px; background: #1a2e15; color: #d4af37; border: 1px solid #d4af37; font-weight: 800; letter-spacing: 0.1em; cursor: pointer; margin-bottom: 15px; transition: all 0.2s; font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        button:hover { background: #2c4c23; }
        
        #error-message { color: #dc2626; font-size: 12px; margin-bottom: 15px; min-height: 18px; font-weight: 800; }
        #loading-message { font-size: 12px; color: #6a7c64; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px; }
    </style>
</head>
<body>
    
    <div class="auth-container" id="main-container">
        <h1>SAYAND</h1>
        <h2 id="page-subtitle">Verifying Link...</h2>
        
        <div id="loading-message">Checking secure token...</div>
        <div id="error-message"></div>
        
        <form id="reset-form" style="display: none;">
            <input type="password" id="new-password" placeholder="New Password" required>
            <input type="password" id="confirm-password" placeholder="Confirm New Password" required>
            <button type="submit" id="reset-button">UPDATE PASSWORD</button>
        </form>
    </div>

    <!-- FIREBASE SCRIPTS (Logic Unchanged) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // Exact logic from Source 20 retained here. No changes made.
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        
        const form = document.getElementById('reset-form');
        const errorBox = document.getElementById('error-message');
        const loadingBox = document.getElementById('loading-message');
        const subtitle = document.getElementById('page-subtitle');
        const resetBtn = document.getElementById('reset-button');
        
        if (!oobCode) {
            loadingBox.style.display = 'none';
            subtitle.innerText = "LINK ERROR";
            errorBox.innerText = "Invalid or missing reset link. Please request a new one from the login page.";
        } else {
            firebase.auth().verifyPasswordResetCode(oobCode)
                .then((email) => {
                    loadingBox.style.display = 'none';
                    subtitle.innerText = "CREATE NEW PASSWORD";
                    form.style.display = 'block';
                })
                .catch((error) => {
                    loadingBox.style.display = 'none';
                    subtitle.innerText = "LINK EXPIRED";
                    errorBox.innerText = "This password reset link has expired or has already been used. Please request a new one.";
                });
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.innerText = '';
            
            const p1 = document.getElementById('new-password').value;
            const p2 = document.getElementById('confirm-password').value;
            
            if (p1 !== p2) {
                errorBox.innerText = "Passwords do not match.";
                return;
            }
            if (p1.length < 6) {
                errorBox.innerText = "Password must be at least 6 characters.";
                return;
            }
            
            resetBtn.innerText = "UPDATING...";
            resetBtn.disabled = true;
            
            try {
                await firebase.auth().confirmPasswordReset(oobCode, p1);
                
                document.getElementById('main-container').innerHTML = `
                    <h1>SAYAND</h1>
                    <h2 style="color: #2c4c23; margin-bottom: 20px;">PASSWORD UPDATED</h2>
                    <p style="font-size: 12px; color: #6a7c64; margin-bottom: 30px; line-height: 1.6; font-weight: 600;">Your password has been successfully changed. You can now access your account.</p>
                    <button onclick="window.location.href='login.html'">SIGN IN NOW</button>
                `;
            } catch (error) {
                errorBox.innerText = error.message;
                resetBtn.innerText = "UPDATE PASSWORD";
                resetBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
